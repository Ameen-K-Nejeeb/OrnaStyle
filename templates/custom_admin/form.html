{% extends 'base.html' %}
{% block title %}{{ title }} | OrnaStyle Studio{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-3xl p-8 sm:p-12 border border-ornagold-200/80 shadow-[0_20px_50px_rgba(212,175,55,0.08)]">
    <div class="text-center mb-8 pb-4 border-b border-rose-100">
        <span class="text-xs uppercase tracking-[0.3em] text-rosegold font-semibold">Atelier Workshop</span>
        <h1 class="font-serif text-3xl font-normal text-stone-900 mt-1">{{ title }}</h1>
    </div>

    <form method="post" enctype="multipart/form-data" class="space-y-5">
        {% csrf_token %}
        <div class="space-y-4">
            {{ form.as_p }}
        </div>
        
        <div class="flex items-center justify-end space-x-4 pt-6 border-t border-rose-100">
            <a href="{% url 'dashboard' %}" class="px-6 py-3 rounded-full border border-stone-200 text-xs font-semibold tracking-widest text-stone-600 uppercase hover:bg-stone-50 transition">
                Cancel
            </a>
            <button type="submit" class="px-8 py-3 rounded-full bg-gradient-to-r from-ornagold-500 via-ornagold-600 to-rosegold text-white text-xs uppercase tracking-[0.2em] font-semibold shadow-lg shadow-ornagold-600/20 hover:scale-105 transition-all">
                Save To Vault
            </button>
        </div>
    </form>
</div>
{% endblock %}
