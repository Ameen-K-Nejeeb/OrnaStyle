{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 rounded-3xl border border-rose-100 shadow-[0_4px_25px_-5px_rgba(224,109,130,0.06)]">
    <h2 class="font-serif text-2xl font-normal text-stone-900 mb-6 text-center border-b border-rose-100 pb-4">{{ title }}</h2>
    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="flex justify-end space-x-3 pt-6 border-t border-rose-100">
            <a href="{% url 'dashboard' %}" class="px-5 py-2.5 rounded-full border border-stone-200 text-xs font-semibold text-stone-600 hover:bg-stone-50 transition uppercase tracking-wider">Cancel</a>
            <button type="submit" class="px-6 py-2.5 rounded-full bg-gradient-to-r from-gold-500 to-amber-600 text-white text-xs font-semibold tracking-wider uppercase shadow hover:brightness-105 transition">Save Item</button>
        </div>
    </form>
</div>
{% endblock %}
