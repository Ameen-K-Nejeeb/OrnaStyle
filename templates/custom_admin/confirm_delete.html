{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-3xl border border-rose-100 shadow-sm text-center">
    <span class="text-3xl text-rose-500">&times;</span>
    <h2 class="font-serif text-2xl font-normal text-stone-900 mt-2">Relinquish Piece</h2>
    <p class="text-xs text-stone-500 mt-2 font-light">Confirm the permanent removal of <strong>{{ item.title }}</strong> from the registry.</p>
    <form method="post" class="mt-6 flex justify-center space-x-3">
        {% csrf_token %}
        <a href="{% url 'dashboard' %}" class="px-5 py-2 rounded-full border border-stone-200 text-xs font-semibold text-stone-600 hover:bg-stone-50 transition uppercase">Cancel</a>
        <button type="submit" class="px-5 py-2 rounded-full bg-rose-500 text-white text-xs font-semibold uppercase hover:bg-rose-600 transition shadow">Confirm Delete</button>
    </form>
</div>
{% endblock %}
