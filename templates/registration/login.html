{% extends 'base.html' %}
{% block content %}
<div class="max-w-sm mx-auto bg-white p-8 rounded-3xl border border-rose-100 shadow-[0_4px_25px_-5px_rgba(224,109,130,0.06)]">
    <div class="text-center mb-6">
        <h2 class="font-serif text-2xl font-normal text-stone-900">Maison Sign In</h2>
        <p class="text-xs text-stone-400 mt-1 font-light">Access your personal vault or curator dashboard</p>
    </div>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full mt-4 bg-stone-900 text-white py-3 rounded-full text-xs font-semibold tracking-widest uppercase shadow hover:bg-stone-800 transition">
            Enter Atelier
        </button>
    </form>
</div>
{% endblock %}
