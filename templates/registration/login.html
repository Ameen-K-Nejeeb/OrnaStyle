{% extends 'base.html' %}
{% block title %}Sign In | OrnaStyle Haute Joaillerie{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 sm:p-10 rounded-3xl border border-ornagold-200/80 shadow-[0_20px_40px_rgba(212,175,55,0.08)]">
    <div class="text-center mb-6">
        <span class="text-xs uppercase tracking-[0.3em] text-rosegold font-semibold">Welcome Back</span>
        <h2 class="font-serif text-3xl font-normal text-stone-900 mt-1">Atelier Sign In</h2>
        <p class="text-xs text-stone-500 mt-1 font-light">Access your personal vault or curator dashboard</p>
    </div>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full mt-6 py-3.5 rounded-full bg-stone-900 text-ornagold-200 text-xs uppercase tracking-[0.2em] font-semibold shadow-xl hover:bg-stone-800 transition-all">
            Enter OrnaStyle
        </button>
    </form>

    <div class="text-center mt-6 pt-4 border-t border-rose-50 text-xs text-stone-500">
        New to the Maison? <a href="{% url 'register' %}" class="text-rosegold font-semibold hover:underline">Create an account</a>
    </div>
</div>
{% endblock %}
